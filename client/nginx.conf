# SilexGIS web front: serves the SPA, proxies API + OIDC to the api service.
# TLS terminates at an outer proxy.

# Preserve an upstream X-Forwarded-Proto (outer TLS proxy); fall back to our scheme.
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript text/javascript application/json image/svg+xml;

    location ~ ^/(api|connect|health|openapi)(/|$) {
        proxy_pass http://api:8080;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # An upload has to clear this before the application's own limit is ever consulted,
        # and a body refused here fails with a proxy error the application cannot explain.
        # So this stays above every configured cap: file uploads default to 512 MB, rasters
        # to 512 MB, and both are raisable. Raising either past 1 GB means editing this file
        # and rebuilding the web image — the value is baked in at build time and cannot be
        # driven by an environment variable.
        client_max_body_size 1024m;
        # Stream the body through rather than buffering the whole of it on disk first.
        proxy_request_buffering off;
    }

    location /.well-known/ {
        proxy_pass http://api:8080;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Hashed assets can be cached forever; index.html must not be.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # The 3D engine's runtime files (shader workers, decoders, icons) keep the names their
    # library gave them, so they are not content-hashed the way /assets/ is. The library version
    # is in the path instead, which makes them just as safe to cache forever: an upgrade changes
    # the path, so a browser can never mix new engine code with an old decoder.
    location /cesiumStatic/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        # A missing file here would otherwise fall through to the SPA and answer 200 with
        # index.html, which the engine reports as an unexplained blank globe.
        try_files $uri =404;
    }

    # Pre-baked elevation tiles, when an installation has mounted a pyramid here. Absent from a
    # stock deployment, where this block matches nothing and costs nothing.
    #
    # THE ONE RULE: whatever encoding this server declares for a tile must describe the bytes on
    # disk, exactly. Terrain tiles are a binary mesh format, and a browser handed a tile whose
    # declared encoding is wrong reports no error of any kind — every request answers 200, the
    # console stays empty, and the only symptom is a globe with no ground on it. So nothing here
    # sets Content-Encoding by hand, and compression on the fly is switched off explicitly rather
    # than left to whatever the inherited type list happens to contain.
    #
    # An installation that wants the tiles compressed — worth roughly 60% over the wire — gzips
    # each tile into a SIBLING .gz file and keeps the original. gzip_static then serves whichever
    # of the two the browser can take, and labels it itself, which is the only way to get the
    # pairing right that cannot also get it wrong. Never gzip a tile in place: that is exactly
    # the failure above.
    # The pyramid's manifest, which must NOT be cached the way its tiles are.
    #
    # Every tile URL a browser builds ends with the version this manifest declares, and the bake
    # script derives that version from the tiles themselves — so a re-bake changes every tile URL
    # and no stale tile can be reused. That only works if the manifest itself is re-read: cached
    # for a week alongside the tiles, a browser keeps building last week's URLs, answers them all
    # out of its own cache, and never sends a request at all. The visible result is ground drawn
    # from elevation the installation no longer has, with no error anywhere — and if the re-bake
    # changed the vertical datum, every cave sitting about forty metres off its hillside.
    #
    # Declared before the tile rule below because an exact match wins over a prefix match.
    location = /terrain/layer.json {
        gzip off;
        try_files $uri =404;
        add_header Cache-Control "no-cache";
    }

    location /terrain/ {
        gzip off;
        gzip_static on;
        # A missing tile would otherwise fall through to the SPA and answer 200 with index.html,
        # which is the same silent blank globe reached by a different route.
        try_files $uri =404;
        # Safe to keep for a long time only because the bake script stamps the pyramid's own
        # content into the version on the end of every tile URL: a re-bake moves every tile to a
        # new address rather than changing what is at an old one. Cached tiles from a previous
        # pyramid are then simply never asked for again.
        add_header Cache-Control "public, max-age=604800";
    }

    # nginx's bundled mime.types has no .webmanifest entry, so the manifest would go out as
    # application/octet-stream. Set on this one file rather than through a `types` block,
    # which replaces the inherited map wholesale instead of extending it — at server level
    # that would strip the type off every script and stylesheet here.
    location = /manifest.webmanifest {
        default_type application/manifest+json;
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
    }
}
