# SilexGIS web front: serves the SPA, proxies API + OIDC to the api service.
# TLS terminates at an outer proxy.

# Preserve an upstream X-Forwarded-Proto (outer TLS proxy); fall back to our scheme.
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

# How long a file of a pyramid this installation baked for itself may be kept by a browser. The
# manifest and the tiles under it get opposite answers, and the difference is decided here rather
# than by a second location because each build is served from an address of its own — there is no
# one fixed path a rule for the manifest could name.
#
# Every tile address a browser builds ends with the version the manifest declares, and that version
# is derived from the tiles themselves, so tiles made again live at new addresses and no stale tile
# is ever asked for again. That is what makes a week safe for them. It only works if the manifest
# itself is re-read: cached for a week alongside its tiles, a browser goes on building addresses
# from a version that no longer exists, answers every one of them out of its own cache, and sends no
# request at all. What that looks like is ground drawn from elevation this installation no longer
# has, with no error anywhere — and every cave about forty metres off its hillside if what changed
# between the two pyramids was the vertical datum.
map $uri $terrain_build_cache {
    default                                 "public, max-age=604800";
    "~^/terrain/builds/[^/]+/layer\.json$"  "no-cache";
}

# ---- Keeping credentials out of the access log ---------------------------------------------
#
# <b>Some of this application's addresses ARE the password.</b> A published trip is followed at
# `/shared/trips/<token>`, the page inside it reads `/api/v1/public/trips/<token>`, and every file
# it draws — the survey model, each published photograph — is fetched with a signed `token=` in the
# query. Each of those is the whole of the holder's claim, because the caller is a browser loading a
# page or an image and can attach no header. The account flows carry one of their own: a password
# reset is `/reset-password?email=…&token=…`, and that one is worth an account rather than a page.
#
# nginx's built-in `combined` format writes `$request`, which is the method and the full request URI.
# So with no `log_format` of its own an installation writes one live credential per line, once a
# minute per follower, for as long as anybody is watching — into the file an operator tails, the one
# a support bundle ships, and the one that gets pasted into a bug report. Anyone holding a copy can
# open every published page on the installation.
#
# Two things are therefore replaced below, and the second is the one that is easy to miss:
#
#   $request_uri      the address itself.
#   $http_referer     the address the browser came FROM. A follower's page is same-origin with the
#                     API it calls, so the default referrer policy sends the FULL page URL — token
#                     and all — on every one of those polls. Scrubbing only the request would have
#                     left the same token in the next column of the same line.
#
# <b>Each of them goes through TWO maps in series, and that is the whole shape of this rule.</b>
# An nginx `map` answers with the FIRST entry that matches and then stops — it is a lookup table,
# not a sequence of substitutions — so one map cannot take a credential out of the path AND out of
# the query of the same address: whichever entry matched first would answer, and the other
# credential would be written in full. A follow link that also carries a signed delivery token,
# `/shared/trips/<token>?token=<signed>`, is precisely that address, and under a single map the
# share token — the more valuable of the two, since it opens the page rather than one file — was
# the half that survived. So the path is scrubbed into an intermediate variable and the query rule
# is applied to THAT. A map whose source is another map's result is ordinary nginx; the chain is
# what makes "both halves" true rather than "whichever half matched first".
#
# <b>The path entries are not anchored to the end of the address, and that is not an oversight.</b>
# Ending each pattern with a closed list of permitted tails is how this leaked before: anything the
# list did not foresee — a trailing slash, which the single-page application serves quite happily,
# or a sub-path such as `/api/v1/public/albums/<token>/cover` — matched no entry at all, fell
# through to the default, and wrote the credential in full beside correctly-scrubbed lines. So the
# entries say what a credential IS — the one segment after the prefix, up to the next `/`, `?` or
# `#` — and keep whatever follows it, whatever that turns out to be. That tail is worth keeping:
# `/embed` after a follow token is the difference between somebody reading the published page and
# somebody's article framing it, which is exactly what this log is read to find out.
#
# <b>A query holding a delivery token loses the whole query, not just that parameter.</b> A map
# cannot iterate, so an entry that replaces one parameter is right for one occurrence and wrong for
# two — `?token=a&token=b` left one of them written out in full — and "right until somebody appends
# another parameter" is not a property worth having for a credential. The blunt rule cannot fail in
# the direction that leaks. What it costs is the company a token keeps, on those lines only: the
# `size=` a thumbnail was asked for, the `user=` on a confirmation link. The application's own
# request log keeps them, because it parses the query instead of pattern-matching it. Everything
# around the credential survives on both sides — the method, the route and what follows the token
# — so which endpoint was called is never in doubt either way. It also takes out the e-mail address
# sitting beside a password-reset token, which is no loss.
#
# Everything else `combined` carries is kept, in the same order, so existing log tooling parses this
# format unchanged: the client address, the user, the time, the method, the protocol, the status, the
# size and the user agent are all untouched, and a request that carried no referer still writes `-`
# rather than an empty pair of quotes. What a scrubbed line still answers is every question an access
# log is normally asked — which endpoint, how often, how fast, what status, from where.
#
# What it cannot answer is which link: nginx has no hashing, so it can only say that a credential was
# there. The application's own request log writes a short handle in the same position — a prefix of
# the hash the share row stores — so an operator who needs to identify a link reads that log rather
# than this one. What these maps do to an address is pinned by `deploy/logscrub.test.mjs`, which
# evaluates them against a table of addresses rather than reading them for the right words.
#
# One shape deliberately outside all of this: a credential that appears inside the VALUE of a query
# parameter — a `?next=/shared/trips/<token>` — is not taken out by the path entries, which read the
# address from its start. No address this application builds has that shape, and a query carrying a
# delivery token is emptied wholesale in any case.
#
# And one residue, stated rather than left to be found: `error_log` is written by nginx itself and
# quotes the request line it failed on, so an upstream timeout can still put a token in the error
# file. That is a reason the links expire, not something a log format can fix.

# Stage one of two: the credential that rides in the PATH, as the segment after one of these
# prefixes. Listed one per line rather than generalised — each is a capability somebody chose to
# hand out, and a table that scrubbed four of five identical shapes would read as a decision.
map $request_uri $silexgis_uri_scrubbed_path {
    default $request_uri;

    "~^(/shared/trips/)[^/?#]+(.*)$"                  "$1[redacted]$2";
    "~^(/api/v1/public/trips/)[^/?#]+(.*)$"           "$1[redacted]$2";
    "~^(/api/v1/shared/features/)[^/?#]+(.*)$"        "$1[redacted]$2";
    "~^(/api/v1/shared/views/)[^/?#]+(.*)$"           "$1[redacted]$2";
    "~^(/api/v1/public/albums/)[^/?#]+(.*)$"          "$1[redacted]$2";
}

# Stage two: the signed delivery token that rides in the QUERY, asked of what stage one answered so
# that an address carrying both comes out with both gone.
map $silexgis_uri_scrubbed_path $silexgis_log_uri {
    default $silexgis_uri_scrubbed_path;

    "~^([^?]*\?)(?:.*&)?token=.*$"                    "$1[redacted]";
}

# The same two stages for where the browser came from. The path entries differ from the ones above
# in one way only: a referer is an absolute URL, so the prefix may sit after an origin rather than
# at the start of the string.
map $http_referer $silexgis_referer_scrubbed_path {
    default $http_referer;

    # What `combined` writes when a browser sent no referer at all, kept so that a line from this
    # format reads exactly as a line from that one.
    ""                                                "-";

    "~^(.*?/shared/trips/)[^/?#]+(.*)$"               "$1[redacted]$2";
    "~^(.*?/api/v1/public/trips/)[^/?#]+(.*)$"        "$1[redacted]$2";
    "~^(.*?/api/v1/shared/features/)[^/?#]+(.*)$"     "$1[redacted]$2";
    "~^(.*?/api/v1/shared/views/)[^/?#]+(.*)$"        "$1[redacted]$2";
    "~^(.*?/api/v1/public/albums/)[^/?#]+(.*)$"       "$1[redacted]$2";
}

map $silexgis_referer_scrubbed_path $silexgis_log_referer {
    default $silexgis_referer_scrubbed_path;

    "~^([^?]*\?)(?:.*&)?token=.*$"                    "$1[redacted]";
}

# `combined`, with the request URI and the referer taken from the maps above instead of straight
# from the request.
log_format silexgis_scrubbed
    '$remote_addr - $remote_user [$time_local] '
    '"$request_method $silexgis_log_uri $server_protocol" '
    '$status $body_bytes_sent '
    '"$silexgis_log_referer" "$http_user_agent"';

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Every line goes through the scrubbing maps above rather than through the built-in `combined`
    # format, because this server's addresses carry credentials in them. Same path as the default,
    # so a container still writes to stdout and a host install still writes where logrotate looks.
    access_log /var/log/nginx/access.log silexgis_scrubbed;

    gzip on;
    gzip_types text/plain text/css application/javascript text/javascript application/json image/svg+xml;

    # ---- Who may put this application inside a frame -------------------------------------
    #
    # Nobody, except the two published-trip addresses and the sites an operator names. Before this
    # existed the application sent no framing header at all, which does not mean "deny" — it means
    # any page on the internet could load this one in an invisible frame over its own controls and
    # take a signed-in reader's clicks. Nothing about that is visible to the reader or to us.
    #
    # Both headers, deliberately. `frame-ancestors` is the one that can name origins and is what
    # every current browser obeys; `X-Frame-Options` says the same thing to anything old enough not
    # to read the first. They are only stated together where the answer is "nobody": X-Frame-Options
    # cannot express a list, and sending its dead `ALLOW-FROM` beside a working `frame-ancestors`
    # is how an embed ends up refused by one header while being allowed by the other.
    #
    # `always`, so a refusal carries the policy too — an error page is a document like any other.
    #
    # <b>Stated at server level AND again in the locations that serve documents.</b> add_header does
    # not inherit into a location that has any add_header of its own, and most locations here set
    # one for caching — so the server-level pair covers only what sets none, and the repetitions
    # below are what actually reach the addresses a browser would be made to frame. The locations
    # that go without it serve hashed assets, engine runtimes and terrain tiles: nothing there is a
    # page with controls on it, so framing one buys whoever tries it nothing.
    add_header Content-Security-Policy "frame-ancestors 'none'" always;
    add_header X-Frame-Options "DENY" always;

    location ~ ^/(api|connect|health|openapi)(/|$) {
        proxy_pass http://api:8080;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Said again here because this location is where the sign-in flow's own pages come from,
        # and a framed authorization page is the clickjacking case worth the most to an attacker.
        add_header Content-Security-Policy "frame-ancestors 'none'" always;
        add_header X-Frame-Options "DENY" always;
        # An upload has to clear this before the application's own limit is ever consulted,
        # and a body refused here fails with a proxy error the application cannot explain.
        # So this stays above every configured cap: file uploads default to 512 MB, rasters
        # to 512 MB, and both are raisable. Raising either past 1 GB means editing this file
        # and rebuilding the web image — the value is baked in at build time and cannot be
        # driven by an environment variable.
        client_max_body_size 1024m;
        # Stream the body through rather than buffering the whole of it on disk first.
        proxy_request_buffering off;
    }

    location /.well-known/ {
        proxy_pass http://api:8080;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Hashed assets can be cached forever; index.html must not be.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # A module script must be served as JavaScript or the browser refuses it outright — strict
    # MIME checking applies to modules and to nothing else, so this failure appears only for
    # them. nginx's bundled type map has no entry for this extension, so without the line below
    # the file goes out as application/octet-stream and is rejected.
    #
    # The PDF renderer's parser worker is the one file in the build with that extension, which is
    # what makes this worth spelling out: the development server declares types itself, so the
    # viewer works there and fails only in the packaged image, with nothing in the network log
    # but a 200. Content-hashed like everything under /assets/, hence the same caching — stated
    # again because a regular-expression location wins over the prefix one above and would
    # otherwise drop it.
    location ~ \.mjs$ {
        default_type text/javascript;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # The 3D engine's runtime files (shader workers, decoders, icons) keep the names their
    # library gave them, so they are not content-hashed the way /assets/ is. The library version
    # is in the path instead, which makes them just as safe to cache forever: an upgrade changes
    # the path, so a browser can never mix new engine code with an old decoder.
    location /cesiumStatic/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        # A missing file here would otherwise fall through to the SPA and answer 200 with
        # index.html, which the engine reports as an unexplained blank globe.
        try_files $uri =404;
    }

    # The cave viewer's runtime (bundle, web workers, stylesheet) follows the same scheme:
    # not content-hashed, but the distribution version is in the path, so a new build always
    # arrives under new URLs and these can be cached forever.
    location /caveview/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        # A missing file — a worker script, or a language file the viewer probes for — must
        # answer 404, not fall through to the SPA: a worker parsing index.html fails with
        # nothing pointing at the real cause.
        try_files $uri =404;
    }

    # Terrain this installation baked for itself, served straight off the volume the application
    # writes finished pyramids into. Absent from an installation that has never built any, where
    # this block matches nothing and costs nothing.
    #
    # THE ALIAS IS A SECURITY BOUNDARY, not a matter of where files happen to sit. Everything
    # beneath the directory named here is downloadable by anybody who can reach this site, with no
    # account, and without a single request reaching the application — terrain is the one thing
    # here the application never sees a request for. A build keeps the rasters the operator gave it,
    # and the intermediates made from them, beside its tiles; finished pyramids are moved out into
    # this directory precisely so that a rule can name a directory holding nothing else. Naming the
    # volume's root, or a build's own folder, publishes the operator's source data.
    #
    # Each build is served from an address of its own and an address is never reused. That is what
    # makes the week-long cache above safe, and it is also what makes choosing a different build
    # visible at all: the 3D engine ignores a terrain source whose address has not changed, so
    # publication moves the address rather than changing what sits behind one.
    #
    # A path with nothing behind it answers 404 from here rather than falling through to the
    # single-page application, because a location that matched is where the request stays. That
    # matters more than it looks: the engine handed this application's own HTML where a tile should
    # be reports nothing at all, and the only symptom is a globe with no ground on it.
    location /terrain/builds/ {
        alias /srv/terrain/published/;
        # Whatever encoding this server declares for a tile must describe the bytes on disk,
        # exactly — see the rule spelled out below, which applies here identically.
        gzip off;
        gzip_static on;
        add_header Cache-Control $terrain_build_cache;
    }

    # Pre-baked elevation tiles, when an installation has mounted a pyramid here — the older path,
    # where an operator bakes with a command-line tool, mounts the result, and names it in the
    # application's own configuration. Kept working exactly as it was: an installation set up that
    # way must go on drawing what it drew yesterday. Absent from a stock deployment, where this
    # block matches nothing and costs nothing.
    #
    # THE ONE RULE: whatever encoding this server declares for a tile must describe the bytes on
    # disk, exactly. Terrain tiles are a binary mesh format, and a browser handed a tile whose
    # declared encoding is wrong reports no error of any kind — every request answers 200, the
    # console stays empty, and the only symptom is a globe with no ground on it. So nothing here
    # sets Content-Encoding by hand, and compression on the fly is switched off explicitly rather
    # than left to whatever the inherited type list happens to contain.
    #
    # An installation that wants the tiles compressed — worth roughly 60% over the wire — gzips
    # each tile into a SIBLING .gz file and keeps the original. gzip_static then serves whichever
    # of the two the browser can take, and labels it itself, which is the only way to get the
    # pairing right that cannot also get it wrong. Never gzip a tile in place: that is exactly
    # the failure above.
    #
    # The pyramid's manifest, which must NOT be cached the way its tiles are.
    #
    # Every tile URL a browser builds ends with the version this manifest declares, and the bake
    # script derives that version from the tiles themselves — so a re-bake changes every tile URL
    # and no stale tile can be reused. That only works if the manifest itself is re-read: cached
    # for a week alongside the tiles, a browser keeps building last week's URLs, answers them all
    # out of its own cache, and never sends a request at all. The visible result is ground drawn
    # from elevation the installation no longer has, with no error anywhere — and if the re-bake
    # changed the vertical datum, every cave sitting about forty metres off its hillside.
    #
    # Declared before the tile rule below because an exact match wins over a prefix match.
    location = /terrain/layer.json {
        gzip off;
        try_files $uri =404;
        add_header Cache-Control "no-cache";
    }

    location /terrain/ {
        gzip off;
        gzip_static on;
        # A missing tile would otherwise fall through to the SPA and answer 200 with index.html,
        # which is the same silent blank globe reached by a different route.
        try_files $uri =404;
        # Safe to keep for a long time only because the bake script stamps the pyramid's own
        # content into the version on the end of every tile URL: a re-bake moves every tile to a
        # new address rather than changing what is at an old one. Cached tiles from a previous
        # pyramid are then simply never asked for again.
        add_header Cache-Control "public, max-age=604800";
    }

    # nginx's bundled mime.types has no .webmanifest entry, so the manifest would go out as
    # application/octet-stream. Set on this one file rather than through a `types` block,
    # which replaces the inherited map wholesale instead of extending it — at server level
    # that would strip the type off every script and stylesheet here.
    location = /manifest.webmanifest {
        default_type application/manifest+json;
        add_header Cache-Control "no-cache";
    }

    # The two addresses a published trip has: the page somebody follows a party on, and the same
    # trip as a viewer with no chrome, made to be framed. They are the only addresses in this
    # application that may be framed at all, and by whom is this file's one setting.
    #
    # `SILEXGIS__Web__FrameAncestors` is a space-separated list of origins — `https://club.example.org
    # https://www.club.example.org` — substituted into this file when the container starts. Empty,
    # which is the default, leaves `'self'` alone: the embed then works from this installation's own
    # pages and from nowhere else, so an operator who has not decided yet has published nothing.
    #
    # <b>No X-Frame-Options here, and that is not an omission.</b> That header can say DENY or
    # SAMEORIGIN and nothing else — its `ALLOW-FROM` form was removed from every browser — so
    # sending it beside this would be one header refusing what the other allows, which is exactly
    # how an embed fails with nothing in the console but a blank frame.
    #
    # <b>`try_files` names a file and ends with a code, never with a URI.</b> A URI as the last
    # argument is an internal redirect, and an internal redirect re-runs location matching: the
    # shell would be served from `location /` below and would carry that location's headers, which
    # deny framing. The whole rule would be undone by a line that looks identical to the one
    # underneath it and produces the same page.
    #
    # <b>X-Robots-Tag, because these two addresses are the only ones a crawler can actually read.</b>
    # A follow token is the credential, and the paste-in block this application hands out puts that
    # token into the HTML of a club's own public article — so the address reaches a crawler by the
    # documented workflow, not by anybody leaking it. What the page then says is the party's names,
    # which station each of them was last at, and who is still underground. Indexed, that survives
    # revoking the link: taking a share back closes the live page and does nothing to a copy already
    # in an index or an archive, so the one remedy this design offers would stop covering the
    # disclosure. `noindex` is what removes a page from an index and from its cache; robots.txt would
    # not, because a crawler told not to fetch the page never reads this header either.
    location ~ ^/shared/trips/ {
        try_files /index.html =404;
        add_header Cache-Control "no-cache";
        add_header Content-Security-Policy "frame-ancestors 'self' ${SILEXGIS__Web__FrameAncestors}" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
    }

    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
        add_header Content-Security-Policy "frame-ancestors 'none'" always;
        add_header X-Frame-Options "DENY" always;
    }
}
