# Tells the shared documentation repository (apgeo/speotopo-docs) that the Markdown here
# changed, so the SilexGIS site there (sites/silexgis) is rebuilt and the pages at
# speotopo.ro/silexgis/docs/ follow within minutes. That repository does the building, link
# checking and uploading; this job only sends the signal.
#
# Needs a secret DOCS_SITE_TOKEN: a fine-grained token limited to that repository with
# "Contents: read and write" (the permission GitHub asks for a repository_dispatch). Without
# the secret the job does nothing.

name: Docs site

on:
  push:
    branches: [master]
    paths: ['**/*.md']

# The job token reads the repository and nothing else: no job here writes to it, comments on a
# pull request or publishes a package, and a pull request's jobs run code from that pull request.
# A job that ever needs more asks for it in its own permissions block.
permissions:
  contents: read

jobs:
  notify:
    runs-on: ubuntu-latest
    env:
      HAS_TOKEN: ${{ secrets.DOCS_SITE_TOKEN != '' }}
    steps:
      - name: Ask the documentation site to rebuild
        if: env.HAS_TOKEN == 'true'
        env:
          TOKEN: ${{ secrets.DOCS_SITE_TOKEN }}
        run: |
          curl -fsS -X POST \
            -H "Authorization: Bearer $TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/apgeo/speotopo-docs/dispatches \
            -d '{"event_type":"docs-changed","client_payload":{"site":"silexgis","sha":"${{ github.sha }}"}}'
