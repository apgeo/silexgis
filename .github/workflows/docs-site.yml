# Tells the documentation site's repository that the Markdown here changed, so the published
# pages at speotopo.ro/SilexGIS/docs/ are rebuilt within minutes instead of at the next nightly
# build. The site's repository does the building, link checking and uploading; this job only
# sends the signal.
#
# Needs a secret DOCS_SITE_TOKEN: a fine-grained token limited to that repository with
# "Contents: read and write" (the permission GitHub asks for a repository_dispatch). Without
# the secret the job does nothing, and the nightly build still picks the change up.

name: Docs site

on:
  push:
    branches: [master]
    paths: ['**/*.md']

jobs:
  notify:
    runs-on: ubuntu-latest
    env:
      HAS_TOKEN: ${{ secrets.DOCS_SITE_TOKEN != '' }}
    steps:
      - name: Ask the documentation site to rebuild
        if: env.HAS_TOKEN == 'true'
        env:
          TOKEN: ${{ secrets.DOCS_SITE_TOKEN }}
        run: |
          curl -fsS -X POST \
            -H "Authorization: Bearer $TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/apgeo/silexgis-docs/dispatches \
            -d '{"event_type":"docs-changed","client_payload":{"sha":"${{ github.sha }}"}}'
