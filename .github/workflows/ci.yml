name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Build (warnings as errors)
        run: dotnet build SilexGis.slnx
        working-directory: server
      - name: Test (unit + architecture + Testcontainers integration)
        run: dotnet test SilexGis.slnx --no-build
        working-directory: server

  client:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # 24, not 22: @terrestris/react-geo declares node >=24, and below it the two
          # CaveViewPanel tests fail on a Blob.stream() difference under jsdom whose error
          # message names neither Blob nor the engine.
          node-version: 24
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run lint:deps
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      # The deployment scripts are plain Node with no toolchain of their own, so they are
      # exercised by the runner built into Node. The pattern is quoted because Node expands it
      # itself; letting a shell do it would behave differently on different runners.
      - name: Test the deployment scripts
        run: node --test "deploy/**/*.test.mjs"
        working-directory: ${{ github.workspace }}

  docker:
    runs-on: ubuntu-latest
    needs: [server, client]
    steps:
      - uses: actions/checkout@v4
      - name: Build deployment images
        run: docker compose build
        working-directory: deploy
        env:
          SILEXGIS_DB_PASSWORD: ci-build-only
