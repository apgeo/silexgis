# The installation without Docker, proved on a fresh machine: PostgreSQL and PostGIS from the
# distribution's own packages, nginx in front, the .NET SDK and Node the project names, and the
# scripts under deploy/native doing everything else — prerequisites, database, directories,
# configuration, the web server's site, the build, the start and the check.
#
# Then the rest of an operator's life with it: a backup, an update that rebuilds the same tree and
# switches to it, a restore of the backup, and the check after each. Row counts are compared
# across the backup and the restore so a restore that loaded nothing cannot pass for one that
# loaded everything.
#
# The API runs as a plain process (--service process), not as the systemd service a real Linux
# host gets: the scripts' process mode is what the container proof on the development machine
# uses too, and keeps this job from depending on the runner's service manager. What differs under
# systemd is the unit the installer renders, which the unit tests read line by line.
#
# Weekly as well as on change, because what it installs onto moves underneath it: a distribution
# package, a runner image, a PostGIS release. A path that is only proved when somebody touches it
# rots quietly in between.

name: Native install

on:
  workflow_dispatch:
  schedule:
    - cron: '30 4 * * 1'
  push:
    branches: [master]
    paths:
      - 'deploy/native/**'
      - 'deploy/nginx/**'
      - 'deploy/systemd/**'
      - 'server/**'
      - 'client/package*.json'
      - '.github/workflows/native-install.yml'

concurrency:
  group: native-install-${{ github.ref }}
  cancel-in-progress: true

jobs:
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      PUBLIC_URL: http://localhost:8080
      DB_COUNT: >-
        select (select count(*) from caves) || '/' || (select count(*) from features) || '/' ||
        (select count(*) from "__EFMigrationsHistory")
      # Queued or running background work. The demo data leaves jobs behind (a survey to read, among
      # others), and a job that runs after a count or a backup changes what the count compares —
      # counted before it ran and again after it ran, the two sides differ for a reason that has
      # nothing to do with the restore.
      JOBS_PENDING: select count(*) from processing_jobs where status in (0, 1)
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      # Whatever PostgreSQL the distribution ships, with the PostGIS built for it. Started here
      # because a runner image keeps its database service stopped; on a real host it is running.
      - name: PostgreSQL, PostGIS and nginx from the distribution
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends postgresql postgresql-contrib nginx tzdata
          version=$(ls /usr/lib/postgresql | sort -V | tail -1)
          sudo apt-get install -y --no-install-recommends "postgresql-$version-postgis-3"
          sudo systemctl start postgresql
          psql --version

      # As root, the way an operator runs it: the installer reaches PostgreSQL as the local
      # postgres account, creates the service account, writes under /etc, /opt and /var/lib, and
      # installs the nginx site. sudo resets PATH, so the runner's node and dotnet are passed on.
      - name: Install
        run: >-
          sudo env "PATH=$PATH" "DOTNET_ROOT=$DOTNET_ROOT" node deploy/native/install.mjs
          --service process --public-url "$PUBLIC_URL" --http-port 8080
          --admin-email admin@native-ci.example --seed-demo

      - name: Check
        run: sudo env "PATH=$PATH" node deploy/native/check.mjs

      - name: Let the background work finish
        run: |
          for i in $(seq 1 100); do
            pending=$(sudo -u postgres psql -d silexgis -tAc "$JOBS_PENDING")
            [ "$pending" = 0 ] && exit 0
            sleep 3
          done
          echo "background jobs still pending after 5 minutes: $pending"; exit 1

      - name: Back up
        run: |
          sudo -u postgres psql -d silexgis -tAc "$DB_COUNT" | tee "$RUNNER_TEMP/before.txt"
          sudo env "PATH=$PATH" node deploy/native/backup.mjs "$RUNNER_TEMP/backup"
          sudo test -s "$RUNNER_TEMP/backup/db.sql.gz"
          sudo test -s "$RUNNER_TEMP/backup/files.tar.gz"

      - name: Update (rebuild the same tree and switch to it)
        run: sudo env "PATH=$PATH" "DOTNET_ROOT=$DOTNET_ROOT" node deploy/native/update.mjs --no-pull --force

      - name: Restore the backup
        run: |
          sudo env "PATH=$PATH" node deploy/native/restore.mjs "$RUNNER_TEMP/backup" --yes
          for i in $(seq 1 100); do
            [ "$(sudo -u postgres psql -d silexgis -tAc "$JOBS_PENDING")" = 0 ] && break
            sleep 3
          done
          sudo -u postgres psql -d silexgis -tAc "$DB_COUNT" | tee "$RUNNER_TEMP/after.txt"
          diff "$RUNNER_TEMP/before.txt" "$RUNNER_TEMP/after.txt"

      - name: Check after the restore
        run: sudo env "PATH=$PATH" node deploy/native/check.mjs

      # The check names what failed; why is in these, and the runner is discarded with the job.
      - name: Logs, when something did not pass
        if: failure()
        run: |
          sudo tail -n 200 /var/log/silexgis/api.log || true
          sudo tail -n 50 /var/log/nginx/error.log || true

  # The same installation as a real Linux host gets it: the API under the runner's own systemd,
  # through the unit the installer renders, with the nightly backup timer. What the job above
  # proves with a plain process, this proves with the service manager doing the starting, the
  # restarting after an update, and the stopping.
  install-systemd:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      PUBLIC_URL: http://localhost:8080
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: PostgreSQL, PostGIS and nginx from the distribution
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends postgresql postgresql-contrib nginx tzdata
          version=$(ls /usr/lib/postgresql | sort -V | tail -1)
          sudo apt-get install -y --no-install-recommends "postgresql-$version-postgis-3"
          sudo systemctl start postgresql

      # No --service: as root on a systemd host the installer chooses systemd itself, which is what
      # an operator gets.
      - name: Install
        run: >-
          sudo env "PATH=$PATH" "DOTNET_ROOT=$DOTNET_ROOT" node deploy/native/install.mjs
          --public-url "$PUBLIC_URL" --http-port 8080 --admin-email admin@native-ci.example --seed-demo

      - name: The service and the backup timer are installed and running
        run: |
          systemctl is-enabled silexgis-api
          systemctl is-active silexgis-api
          systemctl is-enabled silexgis-backup.timer
          systemctl list-timers silexgis-backup.timer --no-pager
          sudo env "PATH=$PATH" node deploy/native/check.mjs

      - name: Update (systemd restarts it)
        run: sudo env "PATH=$PATH" "DOTNET_ROOT=$DOTNET_ROOT" node deploy/native/update.mjs --no-pull --force

      # A stop that has to wait for systemd's stop timeout would make every update a minute and a
      # half longer; the API stops in well under a second when asked.
      - name: The service stops promptly and starts again
        run: |
          start=$(date +%s)
          sudo systemctl stop silexgis-api
          took=$(( $(date +%s) - start ))
          echo "stopped in ${took}s"
          [ "$took" -lt 30 ]
          sudo systemctl start silexgis-api
          for i in $(seq 1 60); do curl -fs http://127.0.0.1:5080/health/ready && break; sleep 3; done
          sudo env "PATH=$PATH" node deploy/native/check.mjs

      - name: Logs, when something did not pass
        if: failure()
        run: |
          sudo journalctl -u silexgis-api -n 200 --no-pager || true
          sudo tail -n 50 /var/log/nginx/error.log || true
