# The installation without Docker, proved on a fresh machine: PostgreSQL and PostGIS from the
# distribution's own packages, nginx in front, the .NET SDK and Node the project names, and the
# scripts under deploy/native doing everything else — prerequisites, database, directories,
# configuration, the web server's site, the build, the start and the check.
#
# Then the rest of an operator's life with it: a backup, an update that rebuilds the same tree and
# switches to it, a restore of the backup, and the check after each. Row counts are compared
# across the backup and the restore so a restore that loaded nothing cannot pass for one that
# loaded everything.
#
# The API runs as a plain process (--service process), not as the systemd service a real Linux
# host gets: the scripts' process mode is what the container proof on the development machine
# uses too, and keeps this job from depending on the runner's service manager. What differs under
# systemd is the unit the installer renders, which the unit tests read line by line.
#
# Weekly as well as on change, because what it installs onto moves underneath it: a distribution
# package, a runner image, a PostGIS release. A path that is only proved when somebody touches it
# rots quietly in between.

name: Native install

on:
  workflow_dispatch:
  schedule:
    - cron: '30 4 * * 1'
  push:
    branches: [master]
    paths:
      - 'deploy/native/**'
      - 'deploy/nginx/**'
      - 'deploy/systemd/**'
      - 'server/**'
      - 'client/package*.json'
      - '.github/workflows/native-install.yml'

concurrency:
  group: native-install-${{ github.ref }}
  cancel-in-progress: true

jobs:
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      PUBLIC_URL: http://localhost:8080
      DB_COUNT: >-
        select (select count(*) from caves) || '/' || (select count(*) from features) || '/' ||
        (select count(*) from "__EFMigrationsHistory")
      # Queued or running background work. The demo data leaves jobs behind (a survey to read, among
      # others), and a job that runs after a count or a backup changes what the count compares —
      # counted before it ran and again after it ran, the two sides differ for a reason that has
      # nothing to do with the restore.
      JOBS_PENDING: select count(*) from processing_jobs where status in (0, 1)
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      # Whatever PostgreSQL the distribution ships, with the PostGIS built for it. Started here
      # because a runner image keeps its database service stopped; on a real host it is running.
      - name: PostgreSQL, PostGIS and nginx from the distribution
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends postgresql postgresql-contrib nginx tzdata
          version=$(ls /usr/lib/postgresql | sort -V | tail -1)
          sudo apt-get install -y --no-install-recommends "postgresql-$version-postgis-3"
          sudo systemctl start postgresql
          psql --version

      # As root, the way an operator runs it: the installer reaches PostgreSQL as the local
      # postgres account, creates the service account, writes under /etc, /opt and /var/lib, and
      # installs the nginx site. sudo resets PATH, so the runner's node and dotnet are passed on.
      - name: Install
        run: >-
          sudo env "PATH=$PATH" "DOTNET_ROOT=$DOTNET_ROOT" node deploy/native/install.mjs
          --service process --public-url "$PUBLIC_URL" --http-port 8080
          --admin-email admin@native-ci.example --seed-demo

      - name: Check
        run: sudo env "PATH=$PATH" node deploy/native/check.mjs

      - name: Let the background work finish
        run: |
          for i in $(seq 1 100); do
            pending=$(sudo -u postgres psql -d silexgis -tAc "$JOBS_PENDING")
            [ "$pending" = 0 ] && exit 0
            sleep 3
          done
          echo "background jobs still pending after 5 minutes: $pending"; exit 1

      - name: Back up
        run: |
          sudo -u postgres psql -d silexgis -tAc "$DB_COUNT" | tee "$RUNNER_TEMP/before.txt"
          sudo env "PATH=$PATH" node deploy/native/backup.mjs "$RUNNER_TEMP/backup"
          sudo test -s "$RUNNER_TEMP/backup/db.sql.gz"
          sudo test -s "$RUNNER_TEMP/backup/files.tar.gz"

      - name: Update (rebuild the same tree and switch to it)
        run: sudo env "PATH=$PATH" "DOTNET_ROOT=$DOTNET_ROOT" node deploy/native/update.mjs --no-pull --force

      - name: Restore the backup
        run: |
          sudo env "PATH=$PATH" node deploy/native/restore.mjs "$RUNNER_TEMP/backup" --yes
          for i in $(seq 1 100); do
            [ "$(sudo -u postgres psql -d silexgis -tAc "$JOBS_PENDING")" = 0 ] && break
            sleep 3
          done
          sudo -u postgres psql -d silexgis -tAc "$DB_COUNT" | tee "$RUNNER_TEMP/after.txt"
          diff "$RUNNER_TEMP/before.txt" "$RUNNER_TEMP/after.txt"

      - name: Check after the restore
        run: sudo env "PATH=$PATH" node deploy/native/check.mjs

      # The check names what failed; why is in these, and the runner is discarded with the job.
      - name: Logs, when something did not pass
        if: failure()
        run: |
          sudo tail -n 200 /var/log/silexgis/api.log || true
          sudo tail -n 50 /var/log/nginx/error.log || true

  # The same installation as a real Linux host gets it: the API under the runner's own systemd,
  # through the unit the installer renders, with the nightly backup timer. What the job above
  # proves with a plain process, this proves with the service manager doing the starting, the
  # restarting after an update, and the stopping.
  install-systemd:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      PUBLIC_URL: http://localhost:8080
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: PostgreSQL, PostGIS and nginx from the distribution
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends postgresql postgresql-contrib nginx tzdata
          version=$(ls /usr/lib/postgresql | sort -V | tail -1)
          sudo apt-get install -y --no-install-recommends "postgresql-$version-postgis-3"
          sudo systemctl start postgresql

      # No --service: as root on a systemd host the installer chooses systemd itself, which is what
      # an operator gets.
      - name: Install
        run: >-
          sudo env "PATH=$PATH" "DOTNET_ROOT=$DOTNET_ROOT" node deploy/native/install.mjs
          --public-url "$PUBLIC_URL" --http-port 8080 --admin-email admin@native-ci.example --seed-demo

      - name: The service and the backup timer are installed and running
        run: |
          systemctl is-enabled silexgis-api
          systemctl is-active silexgis-api
          systemctl is-enabled silexgis-backup.timer
          systemctl list-timers silexgis-backup.timer --no-pager
          sudo env "PATH=$PATH" node deploy/native/check.mjs

      - name: Update (systemd restarts it)
        run: sudo env "PATH=$PATH" "DOTNET_ROOT=$DOTNET_ROOT" node deploy/native/update.mjs --no-pull --force

      # A stop that has to wait for systemd's stop timeout would make every update a minute and a
      # half longer; the API stops in well under a second when asked.
      - name: The service stops promptly and starts again
        run: |
          start=$(date +%s)
          sudo systemctl stop silexgis-api
          took=$(( $(date +%s) - start ))
          echo "stopped in ${took}s"
          [ "$took" -lt 30 ]
          sudo systemctl start silexgis-api
          for i in $(seq 1 60); do curl -fs http://127.0.0.1:5080/health/ready && break; sleep 3; done
          sudo env "PATH=$PATH" node deploy/native/check.mjs

      - name: Logs, when something did not pass
        if: failure()
        run: |
          sudo journalctl -u silexgis-api -n 200 --no-pager || true
          sudo tail -n 50 /var/log/nginx/error.log || true

  # The Windows path, as far as a hosted runner can take it: PostgreSQL with PostGIS, the installer
  # run from an elevated prompt (which is what makes it register the API as a Windows service),
  # the service answering its health check, stopping and starting through the service manager, an
  # update, and a backup restored with the same row counts.
  #
  # What this job cannot prove, and INSTALL says so: a web server in front (the installer installs
  # none on Windows, so the checks that need one are skipped and the API is asked on its own port),
  # IIS, an installation on a machine that already has other software, and a reboot (the service
  # starting by itself after one). The database here is a cluster the job initialises with the
  # runner's PostgreSQL and a PostGIS bundle copied onto it, not an installer-managed one.
  install-windows:
    runs-on: windows-latest
    timeout-minutes: 90
    defaults:
      run:
        shell: pwsh
    env:
      PUBLIC_URL: http://localhost:8080
      ADMIN_URL: postgres://postgres:ci@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      # The runner image carries PostgreSQL (PGROOT) with its service stopped, and no PostGIS. The
      # PostGIS project publishes a bundle per PostgreSQL major; its files are copied onto the
      # PostgreSQL directory without replacing any file already there (a bundled copy of a library
      # PostgreSQL ships itself must not displace the one it was built with). The cluster is the
      # job's own, with trust authentication on the loopback, as the Linux job's peer access is.
      - name: PostgreSQL and PostGIS
        run: |
          $pgRoot = if ($env:PGROOT) { $env:PGROOT } elseif ($env:PGBIN) { Split-Path $env:PGBIN } else { '' }
          if (-not $pgRoot -or -not (Test-Path "$pgRoot\bin\postgres.exe")) { throw "This runner image has no PostgreSQL (PGROOT='$env:PGROOT', PGBIN='$env:PGBIN')" }
          $bin = Join-Path $pgRoot 'bin'
          $major = [regex]::Match((& "$bin\postgres.exe" --version), '(\d+)').Groups[1].Value
          Write-Host "PostgreSQL $major at $pgRoot"

          $base = "https://download.osgeo.org/postgis/windows/pg$major/"
          $zip = (Invoke-WebRequest -UseBasicParsing $base).Links.href |
            Where-Object { $_ -match "^postgis-bundle-pg$major-[\d.]+x64\.zip$" } |
            Sort-Object { [version][regex]::Match($_, "pg$major-([\d.]+)x64").Groups[1].Value } |
            Select-Object -Last 1
          if (-not $zip) { throw "No PostGIS bundle for PostgreSQL $major at $base" }
          Write-Host "PostGIS bundle $zip"
          $archive = Join-Path $env:RUNNER_TEMP $zip
          Invoke-WebRequest -UseBasicParsing "$base$zip" -OutFile $archive
          $unpacked = Join-Path $env:RUNNER_TEMP 'postgis-bundle'
          Expand-Archive $archive -DestinationPath $unpacked
          $source = (Get-ChildItem $unpacked -Directory | Select-Object -First 1).FullName
          foreach ($part in 'bin', 'lib', 'share') {
            robocopy (Join-Path $source $part) (Join-Path $pgRoot $part) /E /XC /XN /XO /NFL /NDL /NJH /NJS /NP | Out-Null
            if ($LASTEXITCODE -ge 8) { throw "robocopy of $part failed ($LASTEXITCODE)" }
          }
          $global:LASTEXITCODE = 0

          $data = Join-Path $env:RUNNER_TEMP 'pgdata'
          & "$bin\initdb.exe" -D $data -U postgres -A trust -E UTF8 --locale=C
          if ($LASTEXITCODE -ne 0) { throw 'initdb failed' }
          & "$bin\pg_ctl.exe" -D $data -l (Join-Path $env:RUNNER_TEMP 'postgres.log') -w start
          if ($LASTEXITCODE -ne 0) { throw 'PostgreSQL did not start' }
          & "$bin\psql.exe" -h 127.0.0.1 -U postgres -tAc 'select version()'
          Add-Content $env:GITHUB_PATH $bin
          Add-Content $env:GITHUB_ENV "PG_BIN=$bin"

      # Elevated, as an operator's prompt would be: the installer then registers the API as the
      # service silexgis-api under its own virtual account. It reaches PostgreSQL through
      # --db-admin-url, since there is no local postgres account to become on Windows.
      - name: Install
        run: >-
          node deploy/native/install.mjs
          --service windows-service --public-url $env:PUBLIC_URL --http-port 8080
          --admin-email admin@native-ci.example --seed-demo
          --db-admin-url $env:ADMIN_URL --pg-bin "$env:PG_BIN"

      - name: The service is registered and running
        run: |
          sc.exe query silexgis-api
          sc.exe qc silexgis-api
          if ((sc.exe query silexgis-api | Out-String) -notmatch 'RUNNING') { throw 'silexgis-api is not running' }
          node deploy/native/check.mjs

      # Written to files, so that no shell has to carry a query with quotes in it.
      - name: Queries
        run: |
          Set-Content (Join-Path $env:RUNNER_TEMP 'count.sql') 'select (select count(*) from caves) || ''/'' || (select count(*) from features) || ''/'' || (select count(*) from "__EFMigrationsHistory")'
          Set-Content (Join-Path $env:RUNNER_TEMP 'pending.sql') 'select count(*) from processing_jobs where status in (0, 1)'

      - name: Let the background work finish
        run: |
          $sql = Join-Path $env:RUNNER_TEMP 'pending.sql'
          for ($i = 0; $i -lt 100; $i++) {
            $pending = (psql -h 127.0.0.1 -U postgres -d silexgis -tA -f $sql | Out-String).Trim()
            if ($pending -eq '0') { exit 0 }
            Start-Sleep -Seconds 3
          }
          throw "background jobs still pending after 5 minutes: $pending"

      - name: Back up
        run: |
          $backup = Join-Path $env:RUNNER_TEMP 'backup'
          psql -h 127.0.0.1 -U postgres -d silexgis -tA -f (Join-Path $env:RUNNER_TEMP 'count.sql') | Tee-Object (Join-Path $env:RUNNER_TEMP 'before.txt')
          node deploy/native/backup.mjs $backup
          if ($LASTEXITCODE -ne 0) { throw 'backup failed' }
          foreach ($f in 'db.sql.gz', 'files.tar.gz') {
            if (-not (Test-Path (Join-Path $backup $f)) -or (Get-Item (Join-Path $backup $f)).Length -eq 0) { throw "$f is missing or empty" }
          }

      - name: Update (rebuild the same tree and switch to it)
        run: node deploy/native/update.mjs --no-pull --force

      - name: Restore the backup
        run: |
          node deploy/native/restore.mjs (Join-Path $env:RUNNER_TEMP 'backup') --yes
          if ($LASTEXITCODE -ne 0) { throw 'restore failed' }
          $sql = Join-Path $env:RUNNER_TEMP 'pending.sql'
          for ($i = 0; $i -lt 100; $i++) {
            if (((psql -h 127.0.0.1 -U postgres -d silexgis -tA -f $sql | Out-String).Trim()) -eq '0') { break }
            Start-Sleep -Seconds 3
          }
          $before = (Get-Content (Join-Path $env:RUNNER_TEMP 'before.txt') | Out-String).Trim()
          $after = (psql -h 127.0.0.1 -U postgres -d silexgis -tA -f (Join-Path $env:RUNNER_TEMP 'count.sql') | Out-String).Trim()
          Write-Host "before $before, after $after"
          if ($before -ne $after) { throw 'row counts differ after the restore' }

      - name: Check after the restore
        run: node deploy/native/check.mjs

      # Stopping through the service manager has to finish by itself: a stop that waits for the
      # manager's timeout would make every update slower, and one that never finishes would hang it.
      - name: The service stops promptly and starts again
        run: |
          $watch = [Diagnostics.Stopwatch]::StartNew()
          sc.exe stop silexgis-api
          for ($i = 0; $i -lt 30; $i++) {
            if ((sc.exe query silexgis-api | Out-String) -match 'STOPPED') { break }
            Start-Sleep -Seconds 1
          }
          Write-Host "stopped in $([int]$watch.Elapsed.TotalSeconds)s"
          if ((sc.exe query silexgis-api | Out-String) -notmatch 'STOPPED') { throw 'silexgis-api did not stop within 30 seconds' }
          sc.exe start silexgis-api
          $up = $false
          for ($i = 0; $i -lt 60 -and -not $up; $i++) {
            try { $up = (Invoke-WebRequest -UseBasicParsing http://127.0.0.1:5080/health/ready).StatusCode -eq 200 } catch { Start-Sleep -Seconds 3 }
          }
          if (-not $up) { throw 'the API did not answer its health check after the restart' }
          node deploy/native/check.mjs

      - name: Logs, when something did not pass
        if: failure()
        run: |
          Get-ChildItem 'C:\ProgramData\SilexGIS\logs' -ErrorAction SilentlyContinue | Format-Table Name, Length
          Get-ChildItem 'C:\ProgramData\SilexGIS\logs\api*.log' -ErrorAction SilentlyContinue | Select-Object -Last 1 | ForEach-Object { Get-Content $_.FullName -Tail 200 }
          Get-Content (Join-Path $env:RUNNER_TEMP 'postgres.log') -Tail 50 -ErrorAction SilentlyContinue
