# The browser suite, through the same runner a developer uses: scripts/e2e.mjs stands a
# throwaway database up in Docker, builds and seeds the API, starts the dev server and runs
# Playwright against it, with every spec watched by the console guard. Nothing here is a second
# way of running the suite; it is the first way, on a hosted machine.
#
# The desktop project is dealt into shards by Playwright itself. The three phone projects are
# small enough to share one job, and that job is the only one that installs WebKit. The specs that
# need a photo library beside the application have a job of their own, which brings two along.
#
# Hosted runners on purpose (see integration.yml for why a self-hosted runner must never take a
# pull-request trigger on a public repository). Pushes to master, nightly, and on demand.

name: Browser

on:
  push:
    branches: [master]
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

# The job token reads the repository and nothing else: no job here writes to it, comments on a
# pull request or publishes a package, and a pull request's jobs run code from that pull request.
# A job that ever needs more asks for it in its own permissions block.
permissions:
  contents: read

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    runs-on: ubuntu-latest
    timeout-minutes: 120
    name: desktop ${{ matrix.shard }} of 4
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          submodules: recursive
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
        working-directory: client
      - run: npx playwright install --with-deps chromium
        working-directory: client
      - name: Browser specs
        run: node scripts/e2e.mjs --project=desktop --shard=${{ matrix.shard }}/4
      - name: Keep the traces of what failed
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-desktop-${{ matrix.shard }}
          path: |
            client/test-results
            client/test-results-again
            client/playwright-report
          if-no-files-found: ignore

  phones:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          submodules: recursive
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
        working-directory: client
      - run: npx playwright install --with-deps chromium webkit
        working-directory: client
      - name: Phone, landscape and WebKit specs
        run: node scripts/e2e.mjs --project=mobile-android --project=mobile-android-landscape --project=mobile-ios-smoke
      - name: Keep the traces of what failed
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-phones
          path: |
            client/test-results
            client/test-results-again
            client/playwright-report
          if-no-files-found: ignore

  # The bundle an installation ships, rather than the development server: built, minified and
  # served as files. Errors only a production build has — a chunk that fails to load, a minifier's
  # renaming, an asset path the development server answers and the bundle does not — are swept by
  # the same console guard as everything else. The smoke spec is the walk through the main pages.
  production-bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          submodules: recursive
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
        working-directory: client
      - run: npx playwright install --with-deps chromium
        working-directory: client
      - name: Smoke specs against the production bundle
        run: node scripts/e2e.mjs smoke --project=desktop
        env:
          SILEXGIS_E2E_BUNDLE: production
      - name: Keep the traces of what failed
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-production-bundle
          path: |
            client/test-results
            client/test-results-again
            client/playwright-report
          if-no-files-found: ignore

  # The photo-library specs need two libraries of their own. scripts/e2e-photo-libraries.mjs
  # stands them up from the deployment's own compose files, fills them with generated pictures,
  # and runs the specs with both answering and then again with one of them stopped. Nightly and
  # on demand only: the two libraries' images are gigabytes to fetch.
  photo-libraries:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          submodules: recursive
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: client/package-lock.json
      # The picture generator is Python, and draws with Pillow.
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - run: pip install Pillow
      - run: npm ci
        working-directory: client
      - run: npx playwright install --with-deps chromium
        working-directory: client
      - name: Photo-library specs, against libraries of generated pictures
        run: node scripts/e2e-photo-libraries.mjs
      - name: Keep the traces of what failed
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-photo-libraries
          path: |
            client/test-results
            client/test-results-again
          if-no-files-found: ignore
