# Development database only.
# Usage: docker compose -f docker-compose.dev.yml up -d
# Then: `dotnet run` in server/src/SilexGis.Api and `npm run dev` in client/.
name: silexgis-dev

services:
  db:
    image: postgis/postgis:17-3.5
    environment:
      POSTGRES_DB: silexgis
      POSTGRES_USER: silexgis
      POSTGRES_PASSWORD: silexgis
    ports:
      # Loopback only. This database ships a well-known throwaway password, and a published
      # port is not covered by a host firewall's input rules — Docker forwards it before they
      # are consulted — so a bare "5432:5432" offers it to every machine that can reach this
      # host. The developer still reaches it at localhost:5432 either way.
      - "127.0.0.1:5432:5432"
    volumes:
      - silexgis-dev-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U silexgis -d silexgis"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  silexgis-dev-db:
