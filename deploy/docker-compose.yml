# SilexGIS production deployment.
# Usage: cp .env.example .env → edit → docker compose up -d → http://localhost:8080
name: silexgis

services:
  db:
    image: postgis/postgis:17-3.5
    environment:
      POSTGRES_DB: silexgis
      POSTGRES_USER: silexgis
      POSTGRES_PASSWORD: ${SILEXGIS_DB_PASSWORD:?set SILEXGIS_DB_PASSWORD in .env}
    volumes:
      - silexgis-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U silexgis -d silexgis"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  api:
    build: ../server
    # Any SILEXGIS__* line added to .env (e.g. external login providers) flows through here;
    # the explicit mappings below still take precedence for the common settings.
    env_file:
      - .env
    environment:
      SILEXGIS__Db__ConnectionString: Host=db;Port=5432;Database=silexgis;Username=silexgis;Password=${SILEXGIS_DB_PASSWORD}
      SILEXGIS__PublicUrl: ${SILEXGIS_PUBLIC_URL:-http://localhost:8080}
      SILEXGIS__Admin__Email: ${SILEXGIS_ADMIN_EMAIL:-}
      SILEXGIS__Admin__Password: ${SILEXGIS_ADMIN_PASSWORD:-}
      SILEXGIS__Auth__OpenRegistration: ${SILEXGIS_OPEN_REGISTRATION:-false}
      # Notification sending. Unlike mail and SMS — which an administrator edits from the admin
      # pages — these two are deployment facts, so they stay plain configuration.
      SILEXGIS__Notifications__PollSeconds: ${SILEXGIS_NOTIFICATIONS_POLL_SECONDS:-15}
      SILEXGIS__Notifications__DigestHourUtc: ${SILEXGIS_NOTIFICATIONS_DIGEST_HOUR_UTC:-7}
      SILEXGIS__Files__Root: /data/files
      # Largest accepted upload. The web service's proxy allows 1 GB, so anything up to that
      # works without touching it; going higher means editing client/nginx.conf and
      # rebuilding the web image, because that value is baked in at build time.
      SILEXGIS__Files__MaxUploadBytes: ${SILEXGIS_MAX_UPLOAD_BYTES:-536870912}
      # How much may be stored. Both default to 0, meaning no limit — neither is an allocation,
      # so nothing is reserved and the sum of everybody's quota may exceed the disk. The second
      # is what actually protects the volume, and the operator who mounted it is the one who
      # knows its size.
      SILEXGIS__Files__DefaultUserQuotaBytes: ${SILEXGIS_USER_QUOTA_BYTES:-0}
      SILEXGIS__Files__MaxTotalStoreBytes: ${SILEXGIS_MAX_TOTAL_STORE_BYTES:-0}
      # How long a deleted document can still be got back, and how often the sweep that removes
      # the expired ones runs.
      SILEXGIS__DocumentRetention__RetentionDays: ${SILEXGIS_RETENTION_DAYS:-30}
      SILEXGIS__Keys__Path: /data/keys
      # Where a terrain build works. It must be a volume rather than the default beside the
      # application: a build keeps the rasters it was given until somebody deletes it, which is
      # tens of gigabytes that would otherwise grow the container's own writable layer and then
      # disappear the next time the container is recreated. Nothing is written until somebody
      # starts a build, so an installation that never builds terrain pays nothing for this.
      SILEXGIS__Terrain__BuildRoot: /data/terrain/builds
      # Where the application asks for a bake, and where the answer comes back. It is a directory
      # rather than an address because the program that bakes is a command-line tool and not a
      # server, and the application is deliberately given no way to start containers of its own.
      # Set here whether or not a bake worker is running: it costs an empty directory, and the
      # alternative is two halves of one handover configured in two places, agreeing right up
      # until the day somebody changes one of them.
      SILEXGIS__Terrain__SpoolRoot: /data/terrain/spool
    volumes:
      - silexgis-files:/data/files
      # Data-protection keys must survive container recreation, or every deploy would
      # invalidate outstanding file-access tokens and cookies.
      - silexgis-keys:/data/keys
      # Terrain. Bind-mount a directory on a large disk here instead of using the named volume
      # if the machine's system disk is small — a national build is tens of gigabytes.
      - silexgis-terrain:/data/terrain
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  web:
    build: ../client
    ports:
      - "${SILEXGIS_HTTP_PORT:-8080}:80"
    volumes:
      # The terrain volume, read-only: a pyramid the application baked itself is served from here
      # as static files. It is mounted unconditionally, and in this file rather than in the
      # overlay that adds the bake worker, because a pyramid built once must keep being served
      # after the builder is switched off — and the builder is a 1.4 GB image nobody should have
      # to keep running in order to look at ground that already exists.
      #
      # Mounted outside the directory nginx serves, on purpose. A build keeps the source rasters
      # it was given beside what it made of them, and anything under the served root is one
      # careless location block away from being downloadable; here nothing is reachable except
      # what a block deliberately names.
      #
      # The api service creates these directories in its own image and owns them, and starts
      # first because of the dependency below, so a volume created fresh takes its ownership
      # rather than root's.
      - silexgis-terrain:/srv/terrain:ro
    depends_on:
      - api
    restart: unless-stopped

volumes:
  silexgis-db:
  silexgis-files:
  silexgis-keys:
  silexgis-terrain:
