# SilexGIS — standalone nginx server block for a non-Docker install.
#
# Serves the built SPA (client/dist) and reverse-proxies the API. Adjust the three markers:
#   - server_name          → your hostname
#   - root                 → where you copied client/dist
#   - proxy_pass address   → ASPNETCORE_URLS of the API (default http://127.0.0.1:5080)
#
# TLS: terminate here (certbot/Let's Encrypt) or in front. When TLS is elsewhere, keep the
# X-Forwarded-Proto passthrough below and set SILEXGIS__PublicUrl to the https address.

map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

# How long a file of a pyramid the application baked for itself may be kept by a browser. The
# manifest and the tiles under it get opposite answers, and the difference is decided here rather
# than by a second location because each build is served from an address of its own — there is no
# one fixed path a rule for the manifest could name.
#
# Every tile address a browser builds ends with the version the manifest declares, and that version
# is derived from the tiles themselves, so tiles made again live at new addresses and no stale tile
# is ever asked for again. That is what makes a week safe for them. It only works if the manifest
# itself is re-read: cached for a week alongside its tiles, a browser goes on building addresses
# from a version that no longer exists, answers every one of them out of its own cache, and sends no
# request at all. What that looks like is ground drawn from elevation this installation no longer
# has, with no error anywhere — and every cave about forty metres off its hillside if what changed
# between the two pyramids was the vertical datum.
map $uri $terrain_build_cache {
    default                                 "public, max-age=604800";
    "~^/terrain/builds/[^/]+/layer\.json$"  "no-cache";
}

server {
    listen 80;
    server_name caves.example.org;

    root /var/www/silexgis;
    index index.html;

    # Must stay above every configured upload cap (file uploads and rasters both default to
    # 512 MB, and both are raisable): a body refused here never reaches the application, so
    # the caller gets a proxy error instead of a message naming the limit they exceeded.
    client_max_body_size 1024m;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    location ~ ^/(api|connect|health|openapi)(/|$) {
        proxy_pass http://127.0.0.1:5080;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_request_buffering off;
    }

    location /.well-known/ {
        proxy_pass http://127.0.0.1:5080;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Hashed assets can be cached forever; index.html must not be.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # The 3D engine's runtime files (shader workers, decoders, icons) keep the names their
    # library gave them, so they are not content-hashed the way /assets/ is. The library version
    # is in the path instead, which makes them just as safe to cache forever: an upgrade changes
    # the path, so a browser can never mix new engine code with an old decoder. Without this
    # block the several thousand files here inherit the no-cache below and are revalidated on
    # every page load.
    location /cesiumStatic/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        # A missing file here would otherwise fall through to the SPA and answer 200 with
        # index.html, which the engine reports as an unexplained blank globe. Copy dist/ whole.
        try_files $uri =404;
    }

    # Terrain the application built for itself. Live rather than commented out, because an
    # administrator can start a build from the application without touching this file, and the
    # address it publishes has to answer something. Point the alias at the directory the API is
    # configured to publish into — SILEXGIS__Terrain__PublishRoot, whose default is
    # `data/terrain/published` beside the application — and nothing here needs setting again.
    # Aimed somewhere else, or at a directory that does not exist yet, this answers 404 and the 3D
    # view says the terrain cannot be reached; left out altogether it would instead answer 200 with
    # this application's own HTML, which the 3D engine reports as a damaged pyramid. An honest 404
    # is the point of having the block at all.
    #
    # THE ALIAS IS A SECURITY BOUNDARY. Everything beneath the directory named here is downloadable
    # by anybody who can reach this site, with no account, and without a single request reaching the
    # application — terrain is the one thing here the application never sees a request for. A build
    # keeps the rasters the operator gave it, and the intermediates made from them, beside its
    # tiles; finished pyramids are moved out into their own directory precisely so that this rule
    # can name a directory holding nothing else. Naming the terrain root, or a build's own folder,
    # publishes the operator's source data to the internet.
    #
    # Each build is served from an address of its own and an address is never reused. That is what
    # makes the week-long cache safe, and it is also what makes choosing a different build visible
    # at all: the 3D engine ignores a terrain source whose address has not changed.
    location /terrain/builds/ {
        alias /var/lib/silexgis/terrain/published/;
        # Whatever encoding this server declares for a tile must describe the bytes on disk,
        # exactly — see the rule spelled out below, which applies here identically.
        gzip off;
        gzip_static on;
        add_header Cache-Control $terrain_build_cache;
    }

    # Pre-baked elevation tiles — OPTIONAL, and commented out because a stock install has none.
    # This is the older path, kept working unchanged: an operator bakes a pyramid with the
    # command-line tool, puts it somewhere this server can read, and names it in the API's own
    # configuration, which then wins over anything built inside the application.
    # To enable: uncomment, point the alias at the directory the pre-baker wrote (the one holding
    # layer.json), and set SILEXGIS__Terrain__Url=/terrain/ for the API. Without it the 3D view
    # draws a smooth globe, which needs nothing installed.
    #
    # The alias below deliberately names a directory of its own rather than anything under the
    # directory the application builds terrain in: that one holds each build's source rasters and
    # intermediates beside its tiles, and pointing a location at it would publish them.
    #
    # THE ONE RULE: whatever encoding this server declares for a tile must describe the bytes on
    # disk, exactly. Terrain tiles are a binary mesh format, and a browser handed a tile whose
    # declared encoding is wrong reports no error of any kind — every request answers 200, the
    # console stays empty, and the only symptom is a globe with no ground on it. So nothing here
    # sets Content-Encoding by hand, and compression on the fly is switched off explicitly.
    #
    # To compress the tiles — worth roughly 60% over the wire — gzip each one into a SIBLING .gz
    # file and keep the original. gzip_static then serves whichever the browser can take, and
    # labels it itself. Never gzip a tile in place: that is exactly the failure above.
    #
    # THE OTHER RULE: the manifest must not be cached the way the tiles are. Every tile URL a
    # browser builds ends with the version layer.json declares, and the bake script derives that
    # version from the tiles themselves, so a re-bake moves every tile to a new address and no
    # stale tile is ever asked for again. That only works if the manifest is re-read: cached for a
    # week alongside its tiles, a browser keeps building last week's URLs and answers them all out
    # of its own cache without one request reaching this server — ground drawn from elevation this
    # installation no longer has, no error anywhere, and every cave about forty metres off its
    # hillside if what the re-bake changed was the vertical datum. The exact-match location wins
    # over the prefix one whatever order they appear in.
    #
    # location = /terrain/layer.json {
    #     alias /var/lib/silexgis/terrain-manual/layer.json;
    #     gzip off;
    #     add_header Cache-Control "no-cache";
    # }
    #
    # location /terrain/ {
    #     alias /var/lib/silexgis/terrain-manual/;
    #     gzip off;
    #     gzip_static on;
    #     # A missing tile would otherwise fall through to the SPA and answer 200 with index.html,
    #     # which is the same silent blank globe reached by a different route.
    #     try_files $uri =404;
    #     add_header Cache-Control "public, max-age=604800";
    # }

    # nginx's bundled mime.types has no .webmanifest entry, so the manifest would go out as
    # application/octet-stream. Set on this one file rather than through a `types` block,
    # which replaces the inherited map wholesale instead of extending it — at server level
    # that would strip the type off every script and stylesheet here.
    location = /manifest.webmanifest {
        default_type application/manifest+json;
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
    }
}
