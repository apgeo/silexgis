# SilexGIS — standalone nginx server block for a non-Docker install.
#
# Serves the built SPA (client/dist) and reverse-proxies the API. Adjust the three markers:
#   - server_name          → your hostname
#   - root                 → where you copied client/dist
#   - proxy_pass address   → ASPNETCORE_URLS of the API (default http://127.0.0.1:5080)
#
# TLS: terminate here (certbot/Let's Encrypt) or in front. When TLS is elsewhere, keep the
# X-Forwarded-Proto passthrough below and set SILEXGIS__PublicUrl to the https address.

map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

server {
    listen 80;
    server_name caves.example.org;

    root /var/www/silexgis;
    index index.html;

    # Rasters can be up to the configured cap (default 1 GB); allow the largest upload path.
    client_max_body_size 1024m;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    location ~ ^/(api|connect|health|openapi)(/|$) {
        proxy_pass http://127.0.0.1:5080;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_request_buffering off;
    }

    location /.well-known/ {
        proxy_pass http://127.0.0.1:5080;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Hashed assets can be cached forever; index.html must not be.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # The 3D engine's runtime files (shader workers, decoders, icons) keep the names their
    # library gave them, so they are not content-hashed the way /assets/ is. The library version
    # is in the path instead, which makes them just as safe to cache forever: an upgrade changes
    # the path, so a browser can never mix new engine code with an old decoder. Without this
    # block the several thousand files here inherit the no-cache below and are revalidated on
    # every page load.
    location /cesiumStatic/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        # A missing file here would otherwise fall through to the SPA and answer 200 with
        # index.html, which the engine reports as an unexplained blank globe. Copy dist/ whole.
        try_files $uri =404;
    }

    # nginx's bundled mime.types has no .webmanifest entry, so the manifest would go out as
    # application/octet-stream. Set on this one file rather than through a `types` block,
    # which replaces the inherited map wholesale instead of extending it — at server level
    # that would strip the type off every script and stylesheet here.
    location = /manifest.webmanifest {
        default_type application/manifest+json;
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
    }
}
