# TLS overlay: puts Caddy (automatic Let's Encrypt) in front of the web service.
#
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.tls.yml up -d
#
# Requires in .env:
#   SILEXGIS_DOMAIN=caves.example.org          # public hostname, DNS pointed at this host
#   SILEXGIS_PUBLIC_URL=https://caves.example.org
#   SILEXGIS_TLS_EMAIL=admin@example.org       # Let's Encrypt contact (expiry/revocation notices)
#
# Caddy obtains and renews the certificate automatically; ports 80 and 443 must be
# reachable from the internet for the ACME challenge.
name: silexgis

services:
  caddy:
    image: caddy:2-alpine
    depends_on:
      - web
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      SILEXGIS_DOMAIN: ${SILEXGIS_DOMAIN:?set SILEXGIS_DOMAIN in .env}
      # Required: the Caddyfile's global `email` option takes no empty value, so an unset
      # variable would leave Caddy crash-looping on a config parse error. Fail here instead.
      SILEXGIS_TLS_EMAIL: ${SILEXGIS_TLS_EMAIL:?set SILEXGIS_TLS_EMAIL in .env (Let's Encrypt contact)}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - silexgis-caddy-data:/data
      - silexgis-caddy-config:/config
    restart: unless-stopped

  web:
    # Fronted by Caddy now — stop publishing the plain-HTTP port to the host.
    # (!reset needs Docker Compose v2.24+; on older versions delete this override and
    # firewall the SILEXGIS_HTTP_PORT instead.)
    ports: !reset []

  api:
    environment:
      # Two proxies now sit between a caller and the API: Caddy, then nginx. Each appends its
      # peer to X-Forwarded-For, so the caller's address is two entries from the end. The API
      # walks back exactly this many; at the base file's one it would take Caddy's address for
      # every caller, and the per-address limiters (sign-in, printed codes, published trips)
      # would share one budget across the whole internet.
      SILEXGIS__Proxy__Hops: "2"

volumes:
  silexgis-caddy-data:
  silexgis-caddy-config:
